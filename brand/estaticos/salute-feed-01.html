<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root {
    --azul-noite: #1E3A8A;
    --azul-eletrico: #3B82F6;
    --roxo: #6D28D9;
    --branco: #FFFFFF;
    --preto: #0B0F14;
    --cinza: #9AA4B2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #222; }
  .post {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: var(--preto);
    font-family: "Neue Haas Grotesk Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--branco);
    padding: 80px 88px;
    display: flex; flex-direction: column;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 700px at 100% 0%, rgba(59,130,246,.35), transparent 60%),
      radial-gradient(800px 700px at 0% 100%, rgba(109,40,217,.45), transparent 60%),
      linear-gradient(180deg, var(--preto), var(--azul-noite));
  }
  .content { position: relative; display: flex; flex-direction: column; height: 100%; }
  header { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 44px; font-weight: 700; letter-spacing: .06em; }
  .count { font-size: 26px; color: var(--cinza); letter-spacing: .1em; }
  h1 {
    margin-top: 150px;
    font-size: 116px; line-height: 1.02; font-weight: 400; letter-spacing: -0.02em;
  }
  h1 strong { font-weight: 700; color: var(--azul-eletrico); }
  .card {
    margin-top: 110px;
    width: 100%;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 36px;
    padding: 46px 48px;
    backdrop-filter: blur(20px);
  }
  .tag { font-size: 22px; color: var(--cinza); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 28px; }
  .bubble {
    display: inline-block; max-width: 720px;
    padding: 26px 32px; border-radius: 28px 28px 28px 8px;
    background: rgba(255,255,255,.12);
    font-size: 36px; line-height: 1.3;
  }
  .bubble.out {
    margin-left: auto; display: block; width: fit-content;
    background: linear-gradient(135deg, var(--azul-eletrico), var(--roxo));
    border-radius: 28px 28px 8px 28px;
    margin-top: 22px;
  }
  .meta { font-size: 22px; color: var(--cinza); margin-top: 10px; text-align: right; }
  .stat {
    margin-top: auto;
    display: inline-flex; align-items: center; gap: 16px; align-self: flex-start;
    padding: 18px 30px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.25);
    font-size: 26px;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--azul-eletrico); }
  footer { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: var(--cinza); }
  .arrow {
    width: 84px; height: 84px; border-radius: 50%; background: var(--branco);
    color: var(--preto); display: flex; align-items: center; justify-content: center; font-size: 40px;
  }
</style>
</head>
<body>
<div class="post">
  <div class="glow"></div>
  <div class="content">
    <header>
      <div class="logo">SALUTE</div>
      <div class="count">01 / 03</div>
    </header>

    <h1>Seu time não precisa dormir para <strong>responder.</strong></h1>

    <div class="card">
      <div class="tag">Exemplo ilustrativo · WhatsApp</div>
      <div class="bubble">Oi! Vi o anúncio. Vocês atendem fora do horário comercial?</div>
      <div class="bubble out">Sim! Estou disponível 24 horas. Quer que eu já tire suas dúvidas?</div>
      <div class="meta">✓✓ 23:14</div>
    </div>

    <div class="stat"><span class="dot"></span>Software com IA de atendimento no WhatsApp</div>

    <footer>
      <span>salute.com.br</span>
      <div class="arrow">→</div>
    </footer>
  </div>
</div>
</body>
</html>
