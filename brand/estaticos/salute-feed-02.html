<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --azul-noite:#1E3A8A; --azul:#3B82F6; --roxo:#6D28D9; --preto:#0B0F14; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1350px; overflow:hidden; background:#fff; }
  .post {
    width:1080px; height:1350px; position:relative; overflow:hidden;
    font-family:"Neue Haas Grotesk Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#fff 0%,#fff 28%,#9EC3F7 48%,var(--azul) 62%,var(--azul-noite) 82%,var(--preto) 100%);
    color:var(--preto); text-align:center;
  }
  .logo { position:absolute; top:128px; left:0; right:0; font-size:44px; font-weight:700; letter-spacing:.04em; color:var(--preto); }
  h1 { position:absolute; top:250px; left:0; right:0; font-size:84px; line-height:1.06; font-weight:400; letter-spacing:-0.03em; }
  h1 strong { font-weight:700; }
  .sub { position:absolute; top:500px; left:0; right:0; font-size:42px; line-height:1.3; font-weight:300; color:#111; }
  .card {
    position:absolute; left:360px; top:640px; width:360px; height:290px; border-radius:28px;
    background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(59,130,246,.15));
    border:2px solid rgba(255,255,255,.7); box-shadow:0 30px 80px rgba(30,58,138,.5);
    display:flex; align-items:center; justify-content:center;
    font-size:72px; font-weight:700; color:#fff; letter-spacing:.02em;
  }
  .card span { color:#fff; text-shadow:0 0 30px rgba(255,255,255,.4); }
</style>
</head>
<body>
<div class="post">
  <div class="logo">SALUTE</div>
  <h1>Responde em segundos.<br><strong>Atendimento sem pausa.</strong></h1>
  <div class="sub">Do primeiro contato ao atendimento,<br>no WhatsApp, com IA.</div>
  <div class="card"><span>SALUTE</span></div>
</div>
</body>
</html>
